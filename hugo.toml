# ============================================================
#  思文败类 · 站点配置
#  上线前请把 baseURL 改成你的域名（没有域名时用 https://用户名.github.io/）
# ============================================================
baseURL = "https://example.com/"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
title = "思文败类"
hasCJKLanguage = true          # 中文字数、摘要、阅读时长依赖这一项
enableRobotsTXT = true
summaryLength = 70
timeZone = "Asia/Shanghai"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true            # 允许在 Markdown 里嵌入 iframe（Bandcamp / SoundCloud 等）
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.cjk]
        enable = true
        eastAsianLineBreaks = true   # 中文段落内的换行不会变成空格
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[related]
  includeNewer = true
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[outputs]
  home = ["HTML", "RSS"]

# ---------------- 导航 ----------------
[[menus.main]]
  name = "首页"
  pageRef = "/"
  weight = 1
  [menus.main.params]
    key = "home"
[[menus.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 2
  [menus.main.params]
    key = "posts"
[[menus.main]]
  name = "作品"
