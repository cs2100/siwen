# ---------------- 站点信息 ----------------
[params]
  description = "写作、阅读、摄影、音乐与生活——陈玄的个人网站。"
  tagline = "写作 · 阅读 · 摄影 · 音乐 · 生活"
  footerTagline = "文字 · 思考 · 生活"
  author = "陈玄"
  authorTitle = "写作者 · 随笔创作者"
  authorSubtitle = "文学评论人"
  authorQuote = "生活不止眼前的苟且，还有诗和远方。"
  authorAvatar = "images/avatar.jpg"
  seal = "陈玄"                       # 印章里的两个字
  # 版权声明：全文公开的原创作品，请自行决定保留所有权利或选用 CC 协议
  copyright = "© 陈玄，保留所有权利。"
  # 示例：copyright = "除特别标注外，本站作品以 CC BY-NC-ND 4.0 协议发布。"
  related = true
  # 音频放在对象存储（如 Cloudflare R2）时，在这里填公开地址前缀，
  # 曲目的 file 写相对文件名即可；留空则只读取专辑文件夹里的音频。
  audioBase = ""

  # 首页
  [params.home]
