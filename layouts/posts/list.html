{{ define "main" }}
<div class="wrap narrow-list">
  {{ partial "page-head.html" . }}
  {{- $pag := .Paginate .Pages.ByDate.Reverse -}}
  <div class="post-list">
    {{- range $pag.Pages }}{{ partial "post-card.html" . }}{{ end }}
  </div>
  {{ template "_internal/pagination.html" . }}
</div>
{{ end }}
